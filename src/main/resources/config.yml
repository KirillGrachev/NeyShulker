settings:
  enabled: true # Master switch. If false - the plugin does nothing at all

  shulker:
    # How the shulker box GUI is opened with a right click:
    # AIR        - right click in the air opens the GUI, any block click stays vanilla,
    #              so placing the box always works without modifiers. Recommended.
    # SHIFT      - only while sneaking (Shift + RMB, air or block).
    # NO_SHIFT   - only while NOT sneaking (plain RMB, the box is not placed).
    # ALWAYS     - on every right click, the box can never be placed by hand.
    # SMART      - while sneaking: anywhere. While not sneaking: only in the air.
    open_method: AIR

    title:
      # ORIGINAL - the shulker's own name: the item display name, or the name
      #            from the `names` table below when the item has none
      # CUSTOM   - the format template below; HEX colors supported
      mode: CUSTOM
      format: " #f5e6ff{shulker_name} "
      # Placeholders:
      #   {shulker_name}     - display name of the item, or its name from the
      #                        `names` table for the viewer's client language
      #   {shulker_material} - English material name (White Shulker Box)
      #
      # Name of an unnamed box per client language, the same way a placed box
      # reads in that client. Add one key per language you serve; unknown
      # locales fall back to `default`, then to the English material name.
      names:
        default: "Shulker Box"
        ru_ru: "Шалкеровый ящик"

    save_interval: 10 # Ticks between automatic saves while the GUI is open (20 = 1s)

    blocked_items: # Items that cannot be put into a shulker box (bypass: neyshulker.bypass.blacklist)
      enabled: true
      items:
        - "BEDROCK"
        - "BARRIER"
        - "COMMAND_BLOCK"
        - "CHAIN_COMMAND_BLOCK"
        - "REPEATING_COMMAND_BLOCK"
        - "STRUCTURE_BLOCK"
        - "JIGSAW"
        - "SPAWNER"
        - "END_PORTAL_FRAME"
        - "DEBUG_STICK"

  auto_collect:
    enabled: true # Suck nearby items into a free shulker box in the inventory
    mode: ALL # One gate for both sources (ground drops and inventory sorting):
      # ALL      - vacuum every eligible item within the radius and sort the
      #            whole inventory into the boxes
      # MATCHING - only types already present in a box or in the open GUI;
      #            an empty box stays idle until filled by hand
    full_message_cooldown: 30 # Seconds between repeated "the box is full" notices
      # per player; a mass drop (a creeper explosion on a full box) stays a
      # single line in the chat instead of a message per wave

    scan:
      distance: 4.5 # Pickup radius in blocks; mining reach is ~4.5, so a smaller
      # radius leaves half the drops behind when farming blocks ahead of you

    waves:
      period: 10 # Ticks between waves (10 = 2 scans per second)
      players_per_wave: 5 # Players detected per wave, round robin: the load per
      # wave stays constant no matter how many players are online
      actions_per_wave: 16 # Global insert budget per wave across all players
      queue_per_player: 32 # Waitlist size per player; overflow is re-detected later

    rules:
      only_full_inventory: false # true - collect only when the player
      # inventory has no free slot (vacuum for full-inventory servers)
      merge_into_existing: true # true - a box without free slots still absorbs
      # drops of types it already holds, merging into partial stacks
      ignore_pickup_delay: false # true - also collect items that still have a
      # pickup delay (fresh drops wait ~0.5s before the auto-collect may touch them)
      ignore_player_dropped: true # true - items a player threw are never collected
      # (the throw is remembered, plus the vanilla owner flag as a fallback):
      # trading by throwing and deliberate drops stay between the players
      respect_nearby_players: 4.5 # Skip a drop when another player stands within
      # this many blocks of it (0 disables): on spawn or at someone's farm the loot
      # counts as theirs; solo farming is unaffected
      gamemodes: # Game modes the auto-collect works in (an empty or broken list
      # falls back to the default): creative servers can opt their builders in
        - "SURVIVAL"
        - "ADVENTURE"
      # Target box for a drop when several boxes qualify, top tier first:
      #   1 - a box with a partial stack of the drop type (merge_into_existing),
      #       the stack with the most room left absorbs the drop
      #   2 - a box that already stores the type and has a free slot; the box
      #       holding the most of the type wins, so each type consolidates
      #   3 - any box with a free slot, ranked by fill_order:
      #       BALANCED  - the most free slots wins (load spreads across boxes)
      #       COMPACT   - the fewest free slots wins (boxes fill up one by one)
      #       INVENTORY - the smallest slot number wins (left to right)
      # Ties inside a tier always break by slot order, so the same inventory
      # layout picks the same box wave after wave.
      fill_order: BALANCED

    permission:
      required: false # true - only players with neyshulker.autocollect collect items

    priority_items: # Collected first (most valuable items get into the box first)
      - "NETHERITE_INGOT"
      - "NETHERITE_SCRAP"
      - "ANCIENT_DEBRIS"
      - "DIAMOND"
      - "EMERALD"
      - "GOLD_INGOT"
      - "IRON_INGOT"

    ignored_items: # Items the auto-collect never picks up, from the ground or the inventory
      - "BEDROCK"
      - "BARRIER"
      - "COMMAND_BLOCK"
      - "STRUCTURE_BLOCK"
      - "JIGSAW"
      - "SPAWNER"

sounds: # Sounds are fully configurable: name (org.bukkit.Sound), enabled flag,
  # volume and pitch. An unknown name falls back to the default with a console notice.
  open:
    enabled: true
    sound: BLOCK_SHULKER_BOX_OPEN
    volume: 1.0
    pitch: 1.0
  close:
    enabled: true
    sound: BLOCK_SHULKER_BOX_CLOSE
    volume: 1.0
    pitch: 1.0
  collect:
    enabled: true
    sound: ENTITY_ITEM_PICKUP
    volume: 0.5
    pitch: 1.2

messages:
  enabled: true # Master switch for all plugin messages
  prefix: "&#b388ffNeyShulker &8» &7" # Substituted into {prefix} inside the texts (empty = no prefix)

  no_permission:
    enabled: true
    text: "{prefix}&#ff6b6bYou do not have permission to do this."

  player_only:
    enabled: true
    text: "{prefix}&#ff6b6bThis command is available to players only."

  usage:
    enabled: true
    text:
      - "{prefix}&#8ce0ffNeyShulker commands:"
      - "&f/shulker reload &8- &7reload the configuration"
      - "&f/shulker open &8- &7open the shulker box in your hand"
      - "&f/shulker info &8- &7current session and auto-collect state"
      - "&f/shulker autocollect &8- &7toggle auto-collect for yourself"

  open_error:
    enabled: true
    text: "{prefix}&#ff6b6bFailed to open this shulker box."

  no_shulker_in_hand:
    enabled: true
    text: "{prefix}&#ff6b6bHold a shulker box in your hand first."

  blacklisted:
    enabled: true
    text: "{prefix}&#ff6b6bThis item cannot be placed into a shulker box."

  nested_shulker:
    enabled: true
    text: "{prefix}&#ff6b6bA shulker box cannot be placed into another shulker box."

  self_remove:
    enabled: true
    text: "{prefix}&#ff6b6bYou cannot take the opened shulker box away."

  move_blocked:
    enabled: true
    text: "{prefix}&#ff6b6bThe opened shulker box cannot be moved."

  drop_blocked:
    enabled: true
    text: "{prefix}&#ff6b6bThe opened shulker box cannot be dropped."

  swap_blocked:
    enabled: true
    text: "{prefix}&#ff6b6bThe opened shulker box cannot be swapped."

  no_space:
    enabled: true
    text: "{prefix}&#ffe066The shulker box is full."

  saved:
    enabled: false
    text: "{prefix}&#9dff8cThe contents of the shulker box have been saved."

  info_idle:
    enabled: true
    text:
      - "{prefix}&7No open shulker boxes."
      - "&7Auto-collect: {state}"

  info_session:
    enabled: true
    text:
      - "{prefix}&dShulker: &f{name}"
      - "&dSlot: &f{slot}"
      - "&dFree slots: &f{free}&7/&f{size}"
      - "&dItems inside: &f{items}"
      - "&dOpen for: &f{seconds}&7 s."

  state_on:
    enabled: true
    text: "&aenabled"

  state_off:
    enabled: true
    text: "&cdisabled"

  auto_collect:
    enabled: false # Report what was collected into the chat (useful while testing)
    text: "{prefix}&#8ce0ffCollected items: &f{amount}"

  auto_collect_full:
    enabled: true
    text: "{prefix}&#ffe066The shulker box is full, cannot collect items."

  auto_collect_no_shulker:
    enabled: false
    text: "{prefix}&#ffe066No free shulker box found in your inventory."

  auto_collect_on:
    enabled: true
    text: "{prefix}&#9dff8cAuto-collect enabled."

  auto_collect_off:
    enabled: true
    text: "{prefix}&#ffe066Auto-collect disabled."

  reload:
    enabled: true
    text: "{prefix}&#9dff8cConfiguration reloaded."

permissions:
  enabled: false # Enable the permission system (all checks below become active)
  op_bypass: false # OP players and console ignore permission checks
  use: "neyshulker.use" # Open a shulker box
  auto_collect: "neyshulker.autocollect" # Auto-collect (hang it on a donor rank)
  bypass_blacklist: "neyshulker.bypass.blacklist" # Ignore the item blacklist
  reload: "neyshulker.reload" # /shulker reload
