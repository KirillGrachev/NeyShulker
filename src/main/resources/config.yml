settings:
  enabled: true # Master switch. If false - the plugin does nothing at all

  shulker:
    # How the shulker box GUI is opened with a right click:
    # AIR        - right click in the air opens the GUI, any block click stays vanilla,
    #              so placing the box always works without modifiers. Recommended.
    # SHIFT      - only while sneaking (Shift + RMB, air or block).
    # NO_SHIFT   - only while NOT sneaking (plain RMB, the box is not placed).
    # ALWAYS     - on every right click, the box can never be placed by hand.
    # SMART      - while sneaking: anywhere. While not sneaking: only in the air.
    open_method: AIR

    title:
      # ORIGINAL - the shulker's own name: item display name, or the material
      #            name when the item has none
      # CUSTOM   - the format template below; HEX colors supported
      mode: CUSTOM
      format: " #f5e6ff{shulker_name} "
      # Placeholders: {shulker_name} - display name of the item or its material name

    save_interval: 10 # Ticks between automatic saves while the GUI is open (20 = 1s)

    blacklist: # Items that cannot be put into a shulker box (bypass: neyshulker.bypass.blacklist)
      enabled: true
      items:
        - "BEDROCK"
        - "BARRIER"
        - "COMMAND_BLOCK"
        - "CHAIN_COMMAND_BLOCK"
        - "REPEATING_COMMAND_BLOCK"
        - "STRUCTURE_BLOCK"
        - "JIGSAW"
        - "SPAWNER"
        - "END_PORTAL_FRAME"
        - "DEBUG_STICK"

  auto_collect:
    enabled: true # Suck nearby items into a free shulker box in the inventory
    mode: ALL # One gate for both sources (ground drops and inventory sorting):
      # ALL      - vacuum every eligible item within the radius and sort the
      #            whole inventory into the boxes
      # MATCHING - only types already present in a box or in the open GUI;
      #            an empty box stays idle until filled by hand

    scan:
      distance: 4.5 # Pickup radius in blocks; mining reach is ~4.5, so smaller
        # radii leave half the drops behind when farming blocks ahead of you

    waves:
      period: 10 # Ticks between waves (10 = 2 scans per second)
      players_per_wave: 5 # Players detected per wave, round robin: the load per
        # wave stays constant no matter how many players are online
      actions_per_wave: 16 # Global insert budget per wave across all players
      queue_per_player: 32 # Waitlist size per player; overflow is re-detected later

    rules:
      only_full_inventory: false # true - collect only when the player
        # inventory has no free slot (vacuum for full-inventory servers)
      merge_into_existing: true # true - a box without free slots still absorbs
        # drops of types it already holds, merging into partial stacks
      ignore_pickup_delay: false # true - also collect items that still have a
        # pickup delay (fresh drops wait ~0.5s before the auto-collect may touch them)

    permission:
      required: false # true - only players with neyshulker.autocollect collect items

    feedback:
      messages: false # Report what was collected into the chat (useful while testing)

    priority_items: # Collected first (most valuable items get into the box first)
      - "NETHERITE_INGOT"
      - "NETHERITE_SCRAP"
      - "ANCIENT_DEBRIS"
      - "DIAMOND"
      - "EMERALD"
      - "GOLD_INGOT"
      - "IRON_INGOT"

    blacklist: # These items are never collected
      - "BEDROCK"
      - "BARRIER"
      - "COMMAND_BLOCK"
      - "STRUCTURE_BLOCK"
      - "JIGSAW"
      - "SPAWNER"

messages:
  enabled: true # Master switch for all plugin messages
  prefix: "&#b388ffNeyShulker &8» &7" # Added in front of every message (empty = disabled)

  no_permission:
    enabled: true
    text: "{prefix}&#ff6b6bYou do not have permission to do this."

  player_only:
    enabled: true
    text: "{prefix}&#ff6b6bThis command is available to players only."

  usage:
    enabled: true
    text:
      - "{prefix}&#8ce0ffNeyShulker commands:"
      - "&f/shulker reload &8- &7reload the configuration"
      - "&f/shulker open &8- &7open the shulker box in your hand"
      - "&f/shulker info &8- &7current session and auto-collect state"
      - "&f/shulker autocollect &8- &7toggle auto-collect for yourself"

  open_error:
    enabled: true
    text: "{prefix}&#ff6b6bFailed to open this shulker box."

  no_shulker_in_hand:
    enabled: true
    text: "{prefix}&#ff6b6bHold a shulker box in your hand first."

  blacklisted:
    enabled: true
    text: "{prefix}&#ff6b6bThis item cannot be placed into a shulker box."

  nested_shulker:
    enabled: true
    text: "{prefix}&#ff6b6bA shulker box cannot be placed into another shulker box."

  self_remove:
    enabled: true
    text: "{prefix}&#ff6b6bYou cannot take the opened shulker box away."

  move_blocked:
    enabled: true
    text: "{prefix}&#ff6b6bThe opened shulker box cannot be moved."

  drop_blocked:
    enabled: true
    text: "{prefix}&#ff6b6bThe opened shulker box cannot be dropped."

  swap_blocked:
    enabled: true
    text: "{prefix}&#ff6b6bThe opened shulker box cannot be swapped."

  no_space:
    enabled: true
    text: "{prefix}&#ffe066The shulker box is full."

  saved:
    enabled: false
    text: "{prefix}&#9dff8cThe contents of the shulker box have been saved."

  auto_collect:
    enabled: true
    text: "{prefix}&#8ce0ffCollected items: &f{amount}"

  auto_collect_full:
    enabled: true
    text: "{prefix}&#ffe066The shulker box is full, cannot collect items."

  auto_collect_no_shulker:
    enabled: false
    text: "{prefix}&#ffe066No free shulker box found in your inventory."

  auto_collect_on:
    enabled: true
    text: "{prefix}&#9dff8cAuto-collect enabled."

  auto_collect_off:
    enabled: true
    text: "{prefix}&#ffe066Auto-collect disabled."

  reload:
    enabled: true
    text: "{prefix}&#9dff8cConfiguration reloaded."

  console: # Console notices in the same format as chat messages:
    # enabled flag plus text as a list of lines, HEX colors and {placeholders}
    unknown_sound:
      enabled: true
      text:
        - "&eUnknown sound at {path}: '{value}'. Using {defaultValue}."
    unknown_material:
      enabled: true
      text:
        - "&eUnknown material at {path}: '{value}'. Skipped."
    invalid_value:
      enabled: true
      text:
        - "&eInvalid value at {path}: '{value}'. Using {defaultValue}."

permissions:
  enabled: false # Enable the permission system (all checks below become active)
  op_bypass: false # OP players and console ignore permission checks
  use: "neyshulker.use" # Open a shulker box
  auto_collect: "neyshulker.autocollect" # Auto-collect (hang it on a donor rank)
  bypass_blacklist: "neyshulker.bypass.blacklist" # Ignore the item blacklist
  reload: "neyshulker.reload" # /shulker reload
