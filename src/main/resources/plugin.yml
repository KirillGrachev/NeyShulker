name: NeyShulker
version: '${project.version}'
main: eu.neydev.neyshulker.NeyShulker
api-version: '1.20'
author: Ney
description: Portable shulker boxes with anti-dupe protection and auto-collect
softdepend: [PlaceholderAPI]


commands:
  shulker:
    description: NeyShulker control command
    usage: /shulker <reload|open|info|autocollect>
    aliases: [sh, neyshulker]

permissions:
  neyshulker.use:
    description: Open a shulker box from the inventory
    default: true
  neyshulker.autocollect:
    description: Auto-collect nearby items into shulker boxes
    default: true
  neyshulker.bypass.blacklist:
    description: Bypass the item blacklist
    default: false
  neyshulker.reload:
    description: Reload the plugin configuration
    default: op
  neyshulker.admin:
    description: All NeyShulker permissions
    default: op
    children:
      neyshulker.use: true
      neyshulker.autocollect: true
      neyshulker.bypass.blacklist: true
      neyshulker.reload: true
