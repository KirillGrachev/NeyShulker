name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, coverage and jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify = compile (+ ErrorProne) + tests + jacoco report + coverage gate + spotless
      - name: Build, test and check coverage
        run: mvn -B -ntp verify

      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open('target/site/jacoco/jacoco.csv', encoding='utf-8')))
          missed = sum(int(r['LINE_MISSED']) for r in rows)
          covered = sum(int(r['LINE_COVERED']) for r in rows)
          total = missed + covered
          print(f'Line coverage: {covered}/{total} = {covered / total:.1%}')
          print('Largest classes:')
          for r in sorted(rows, key=lambda r: int(r['LINE_COVERED']) + int(r['LINE_MISSED']), reverse=True)[:10]:
              c, m = int(r['LINE_COVERED']), int(r['LINE_MISSED'])
              print(f"  {r['PACKAGE']}.{r['CLASS']}: {c}/{c + m} = {c / (c + m):.0%}")
          PY

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: NeyShulker-jar
          path: target/NeyShulker-*.jar
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # README обещает работу на 1.20.5+ и 1.21.x: компиляция против новых
  # spigot-api проверяется машиной, а не на веру. Юнит-тесты здесь не
  # гоняются: на 1.21.3+ класс org.bukkit.Sound инициализируется через
  # живой реестр, чего в изолированном JUnit нет, - рантайм проверяет
  # джоба smoke на настоящем сервере.
  api-compat:
    name: Compile against spigot-api ${{ matrix.spigot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spigot:
          - 1.21.4-R0.1-SNAPSHOT
          - 1.21.8-R0.1-SNAPSHOT

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile main sources
        run: mvn -B -ntp -Dspigot.version=${{ matrix.spigot }} -Perrorprone-off clean compile

  # Рантайм-проверка заявленной совместимости: настоящий Paper-сервер
  # стартует с плагином, плагин включается и корректно переживает stop.
  smoke:
    name: Runtime smoke on Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        paper:
          - 1.20.6
          - 1.21.8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: NeyShulker-jar

      - name: Run smoke test
        run: bash ci/smoke-test.sh "${{ matrix.paper }}" "$(ls NeyShulker-*.jar)"
