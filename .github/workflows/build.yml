name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, coverage and jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify = compile + tests + jacoco report + coverage gate (jacoco.line.minimum)
      - name: Build, test and check coverage
        run: mvn -B -ntp verify

      - name: Coverage summary
        run: |
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open('target/site/jacoco/jacoco.csv', encoding='utf-8')))
          missed = sum(int(r['LINE_MISSED']) for r in rows)
          covered = sum(int(r['LINE_COVERED']) for r in rows)
          total = missed + covered
          print(f'Line coverage: {covered}/{total} = {covered / total:.1%}')
          print('Largest classes:')
          for r in sorted(rows, key=lambda r: int(r['LINE_COVERED']) + int(r['LINE_MISSED']), reverse=True)[:10]:
              c, m = int(r['LINE_COVERED']), int(r['LINE_MISSED'])
              print(f"  {r['PACKAGE']}.{r['CLASS']}: {c}/{c + m} = {c / (c + m):.0%}")
          PY

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: NeyShulker-jar
          path: target/NeyShulker-*.jar
          if-no-files-found: error

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  release:
    name: GitHub release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Publish release with jar
        uses: softprops/action-gh-release@v2
        with:
          files: target/NeyShulker-*.jar
          generate_release_notes: true
